name: Fetch Ads History (все магазины)
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'Дата от (YYYY-MM-DD) — пусто = вчера'
        required: false
        default: ''
      date_to:
        description: 'Дата до (YYYY-MM-DD) — пусто = сегодня'
        required: false
        default: ''
  schedule:
    - cron: '40 * * * *'

concurrency:
  group: rnp-funnel-ads-sheets
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        store: [MOTORKRAFT, B, F, G, R, T, Z]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth requests
      - name: Run for ${{ matrix.store }}
        run: |
          attempt_timeout=25m
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            attempt_timeout=55m
          fi
          for attempt in 1 2 3; do
            if timeout --kill-after=15s "$attempt_timeout" python -u fetch_ads_history.py; then
              exit 0
            fi
            if (( attempt < 3 )); then
              delay=$((75 * attempt))
              echo "::warning::Попытка ${attempt} завершилась ошибкой. Повтор через ${delay} с."
              sleep "$delay"
            fi
          done
          exit 1
        env:
          WB_TOKEN: ${{ matrix.store == 'MOTORKRAFT' && secrets.WB_TOKEN || secrets[format('WB_TOKEN_{0}', matrix.store)] }}
          SPREADSHEET_ID: ${{ matrix.store == 'MOTORKRAFT' && secrets.SPREADSHEET_ID || secrets[format('SPREADSHEET_ID_{0}', matrix.store)] }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ADS_DATE_FROM: ${{ github.event.inputs.date_from }}
          ADS_DATE_TO: ${{ github.event.inputs.date_to }}
